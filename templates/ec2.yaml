AWSTemplateFormatVersion: '2010-09-09'
Description: EC2 creada desde GitHub Actions

Resources:

  MyEC2:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0cca150d127c2216f
      InstanceType: t3.micro

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl enable httpd
          systemctl start httpd
          echo "<h1>Servidor desplegado desde GitHub Actions</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: EC2-GitHubActions

Outputs:
  InstanceId:
    Value: !Ref MyEC2